name: build-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: test-on-debian-13
    runs-on: ubuntu-24.04
    container: debian:13-slim
    
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip git curl

      - uses: actions/checkout@v4

      - name: Setup Python Virtual Environment
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest httpx fastapi pydantic pydantic-settings uvicorn

      - name: Run MTE Tests
        working-directory: ./mcoresec/services/devsec/memory-trust-engine
        run: pytest tests/ -v

      - name: Verify MTE CLI Proof
        working-directory: ./mcoresec/services/devsec/memory-trust-engine
        run: python -m mte prove
