[package]
name = "policy-core"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "policy-core"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
