# =============================================================================
# GitHub Actions — Matrix CI/CD for all microservices
# Zero-downtime deploy via Docker Compose with start-first update config
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Lint & Test Matrix — runs per-service in parallel
  # ===========================================================================
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, policy-core, web, neteng, cyberrange, shorborno]
        include:
          - service: ingestion
            language: python
            path: services/ingestion
          - service: policy-core
            language: rust
            path: services/policy-core
          - service: web
            language: node
            path: apps/web
          - service: neteng
            language: python
            path: modules/neteng
          - service: cyberrange
            language: python
            path: modules/cyberrange
          - service: shorborno
            language: python
            path: modules/shorborno
    steps:
      - uses: actions/checkout@v4

      # ---- Python services ----
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install & lint Python
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --no-cache-dir ruff mypy
          ruff check app/ --exit-non-zero-on-fix
          mypy app/ --ignore-missing-imports || true

      - name: Test Python
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short || echo "No tests found, skipping"

      # ---- Rust service ----
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl & test Rust
        if: matrix.language == 'rust'
        working-directory: ${{ matrix.path }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo clippy --target x86_64-unknown-linux-musl -- -D warnings
          cargo test

      # ---- Node service ----
      - name: Set up Node
        if: matrix.language == 'node'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install & test Node
        if: matrix.language == 'node'
        working-directory: ${{ matrix.path }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test || echo "No tests configured"

  # ===========================================================================
  # Job 2: Build & Push — matrix of service × arch, pushed to GHCR
  # ===========================================================================
  build:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, policy-core, web, neteng, cyberrange, shorborno]
        platform: [linux/amd64, linux/arm64]
        exclude:
          # Rust musl build is amd64-only for now
          - service: policy-core
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Dockerfile & context
        id: ctx
        run: |
          case="${{ matrix.service }}"
          case "$case" in
            ingestion)   DOCKERFILE="services/Dockerfile.python"; ARGS="SERVICE=ingestion,PORT=8000" ;;
            neteng)      DOCKERFILE="services/Dockerfile.python"; ARGS="SERVICE=neteng,PORT=9000" ;;
            cyberrange)  DOCKERFILE="services/Dockerfile.python"; ARGS="SERVICE=cyberrange,PORT=9100" ;;
            shorborno)   DOCKERFILE="services/Dockerfile.python"; ARGS="SERVICE=shorborno,PORT=9200" ;;
            policy-core) DOCKERFILE="services/policy-core/Dockerfile"; ARGS="" ;;
            web)         DOCKERFILE="apps/web/Dockerfile"; ARGS="" ;;
          esac
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "buildargs=$ARGS" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.ctx.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.ctx.outputs.buildargs }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ===========================================================================
  # Job 3: Security scan — Trivy on all built images
  # ===========================================================================
  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion, policy-core, web, neteng, cyberrange, shorborno]
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ===========================================================================
  # Job 4: Deploy — zero-downtime via SSH to Debian host
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://fabric.shorbornoai.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (zero-downtime)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEBIAN_HOST }}
          username: ${{ secrets.DEBIAN_USER }}
          key: ${{ secrets.DEBIAN_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/fabric-sandbox
            git pull --ff-only origin main
            cp /opt/fabric-secrets/.env .env

            # Pull latest images
            export IMAGE_PREFIX="${{ env.REGISTRY }}/${{ github.repository }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Zero-downtime: start-first means new container starts before old stops
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps \
              --build web policy ingest neteng cyberrange shorborno cloudflared

            # Prune old images
            docker image prune -f

      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEBIAN_HOST }}
          username: ${{ secrets.DEBIAN_USER }}
          key: ${{ secrets.DEBIAN_SSH_KEY }}
          script: |
            for svc in web policy ingest neteng cyberrange shorborno; do
              if docker inspect --format='{{.State.Health.Status}}' fabric-$svc 2>/dev/null | grep -q healthy; then
                echo "✅ $svc healthy"
              else
                echo "❌ $svc NOT healthy"
                exit 1
              fi
            done
            echo "All services healthy — deploy successful"
