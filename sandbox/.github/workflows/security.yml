# =============================================================================
# Security & Compliance Pipeline — SAST, dependency scan, SBOM, secret scan
# Runs on every push and PR; fails on CRITICAL/HIGH findings
# =============================================================================

name: Security & Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ---- SAST: CodeQL for Python + JavaScript ----
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v3

  # ---- Dependency vulnerability scan ----
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python audit (pip-audit)
        run: |
          pip install pip-audit
          for req in services/ingestion/requirements.txt modules/*/requirements.txt; do
            echo "Auditing $req"
            pip-audit -r "$req" --strict || true
          done

      - name: Node audit (pnpm audit)
        working-directory: apps/web
        run: |
          corepack enable && corepack prepare pnpm@9 --activate
          pnpm audit --audit-level high || true

  # ---- Secret detection ----
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified

  # ---- SBOM generation (CycloneDX) ----
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CycloneDX
        run: pip install cyclonedx-bom
      - name: Generate Python SBOM
        run: |
          for req in services/ingestion/requirements.txt modules/*/requirements.txt; do
            svc=$(basename $(dirname "$req"))
            cyclonedx-py requirements -i "$req" -o "sbom-${svc}.json" -f json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json

  # ---- Container image scan (Trivy on Dockerfiles) ----
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (Dockerfiles)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
